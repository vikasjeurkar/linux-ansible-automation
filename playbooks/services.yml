---
- name: Configure and enable services
  hosts: linux
  tasks:
    - name: Load OS-specific variables
      ansible.builtin.include_vars: "../vars/{{ ansible_os_family }}.yml"

    - name: Ensure services are enabled and running
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - "{{ cron_service }}"
        - "{{ time_service }}"
        - "{{ ssh_service }}"
